<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Bevy Tutorials</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/dark.css" />

  <link rel="stylesheet" href="styles.css">
  <style>
    /* Stili personalizzati per l'highlighting Rust */
    .token.comment {
      color: #6a737d;
      font-style: italic;
    }

    .token.keyword {
      color: #ff79c6;
      font-weight: bold;
    }

    .token.string {
      color: #50fa7b;
    }

    .token.function {
      color: #66d9ef;
    }

    .token.number {
      color: #bd93f9;
    }

    .token.macro {
      color: #ffb86c;
    }

    .token.type {
      color: #8be9fd;
    }

    .token.lifetime {
      color: #f1fa8c;
    }

    .token.attribute {
      color: #ff5555;
    }

    .token.operator {
      color: #f8f8f2;
    }

    .token.reserved {
      color: #ff5555;
    }

    /* Miglioramenti visuali */
    pre code[class*="language-"] {
      padding: 1.5em;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: #f17f0d;
    }

    .markdown-section {
      max-width: 900px;
    }

    /* Icone nella sidebar */
    .sidebar-nav a[data-icon]::before {
      margin-right: 8px;
      font-style: normal;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-rust.min.js"></script>
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>

</html>
